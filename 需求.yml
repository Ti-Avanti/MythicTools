基础需求:
  - 兼容Mythicmobs
  - craftengine的<image:xxx:xxx>支持
  - minimessage消息支持
  - 支持papi命令
  - 根据功能需求自行依赖其他插件但需向用户询问
  - 项目文件地址"D:\MC_Plugin\MythicTools\MythicTools"
  - 开发规范"D:\MC_Plugin\PluginDevRule"
  - 支持多语言，必须和玩家客户端语言一样，比如客户端为英语的玩家看到的内容就是英语，客户端为中文的玩家看到的内容就是在中文，可以使用packetevents最新版作为前置
  - 需要支持papi变量，变量的内容可以编辑，再合适功能处添加papi变量
  - 可以打开插件是否接管mythicmob相关的功能，比如掉落物功能，怪物生成功能，必须要有配置文件让用户选择是否接管
  - 测试服地址"D:\MC_server\test_server\leaf1.21.11"，黑盒测试"C:\Users\Administrator.DESKTOP-PNESMLD\Desktop\blackbox-黑盒测试\黑盒测试使用说明.md"，黑盒测试客户端已经启动，插件写完后需要全部测试通过后再通知我
Mythicmob怪物掉落物:
  - 可以配置某个怪物的掉落物组，需要可以gui配置，用户直接从背包把物品放进去，然后配置掉落权重
  - 也可以配置非物品奖励，比如指令奖励，每种奖励都支持给玩家消息提示
  - 掉落物可以配置不同稀有度分组，每个怪物可以配置允许的的掉落物总数，以及掉落物组以及这个掉落物组掉落的权重和数量
  - 也可以配置经验奖励
Mythicmob刷怪:
  普通怪物:
    刷怪:
      - 生物群落刷怪，玩家进入某个群落的时候会刷新，需要可以配置刷新概率（不能每次进入都给玩家刷新怪物，应该和原版游戏一样随机生成）以及群落，
      - 刷怪点，固定位置定时刷新，需要有papi变量
  Boss: 
    刷怪:
      - 生物群落刷新boss，可以配置刷新概率，可以配置出生的播报（或者执行指令由用户调用其他插件播报）
      - Boss刷怪点固定位置定时刷新，同样需要有播报或者执行命令

    奖励:
      - 按照伤害比例，伤害最高的玩家由高到低，开始获取奖励，根据排名设置获得掉落物(boss配置的掉落物的组)的份数,然后可以设置获得奖励的人数，需要在聊天栏展示玩家的id，然后玩家可以用鼠标放到玩家id上显示hovertext显示玩家获得的奖励以及稀有度等信息
      - 按照击杀玩家，击杀玩家获得奖励
      - 需要注意的是有的boss是多形态，需要击杀最后形态后才给予奖励，所有boss也需要配置每个形态的mythicmob的id，击杀完最后形态
      - boss击杀完也需要有播报，和生成的时候一样


GUI:
  - 所有GUI都需要配置文件让用户配置
  - GUI的布局配置需要是下面这种
  - "#########"
  - "#1234567#"
  - "#abcdefg#"
  - "#########"

  - gui可以配置刷怪点，刷怪，怪物掉落物组的掉落物


